[project]
name = "macrograph-ai"
version = "0.1.0"
description = "Multi-Agent Indian Macroeconomic Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.1.0",
    "fastmcp>=3.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "langgraph>=1.2.0",
    "langchain>=1.3.0",
    "langchain-groq>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "duckdb>=1.1.0",
    "yfinance>=0.2.40",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "networkx>=3.4.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

